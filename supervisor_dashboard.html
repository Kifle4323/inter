<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Supervisor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body class="bg-light">
    <div id="notification-container" style="position: fixed; top: 1rem; right: 1rem; z-index: 1050;"></div>
    <nav id="navbar"></nav>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2">Supervisor Dashboard</h1>
            <h2 class="h5 mb-0">Welcome, <span id="supervisor-name"></span>!</h2>
        </div>

        <div class="row">
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-header">
                        <h3 class="h5 mb-0">Your Assigned Students</h3>
                    </div>
                    <div id="students-list" class="list-group list-group-flush">
                        <!-- Populated by JavaScript -->
                        <div class="list-group-item">Loading...</div>
                    </div>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header">
                        <h3 class="h5 mb-0">Selected Student Details</h3>
                    </div>
                    <div class="card-body">
                        <div id="student-details-content">
                            <div class="alert alert-info">Select a student from the list to view their project details and reports.</div>
                            <div id="student-project-details-container" class="mb-4">
                                <!-- Project progress and details will be loaded here -->
                            </div>
                            <div id="student-reports-container">
                                <!-- Reports will be loaded here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>
</html>
