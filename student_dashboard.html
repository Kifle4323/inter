<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body class="bg-light">
    <div id="notification-container" style="position: fixed; top: 1rem; right: 1rem; z-index: 1050;"></div>
    <nav id="navbar"></nav>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2">Student Dashboard</h1>
            <h2 class="h5 mb-0">Welcome, <span id="student-name"></span>!</h2>
        </div>

        <div class="row">
            <div class="col-lg-8">
                <!-- Available Projects -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h3 class="h5 mb-0">Available Projects</h3>
                    </div>
                    <div class="card-body">
                        <div id="available-projects-container">
                            <!-- Populated by JavaScript -->
                        </div>
                    </div>
                </div>
                <!-- Reports and Feedback -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h3 class="h5 mb-0">Your Reports and Feedback</h3>
                    </div>
                    <div class="card-body">
                        <div id="reports-list">
                            <!-- Populated by JavaScript -->
                            <p>Submit reports for your assigned project.</p>
                        </div>
                    </div>
                </div>
                <!-- My Attendance Record -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="h5 mb-0">My Attendance Record</h3>
                    </div>
                    <div class="card-body">
                        <div id="student-attendance-history-container">
                            <!-- Populated by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <!-- My Supervisor -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h3 class="h5 mb-0">My Supervisor</h3>
                    </div>
                    <div class="card-body">
                        <div id="supervisor-info-container">
                            <!-- Populated by JavaScript -->
                        </div>
                    </div>
                </div>

                <!-- Project Status -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h3 class="h5 mb-0">Your Project Status</h3>
                    </div>
                    <div class="card-body">
                        <div id="project-status-container">
                            <!-- Populated by JavaScript -->
                            <p>Apply for a project to get started.</p>
                        </div>
                    </div>
                </div>

                <!-- Submit a Report -->
                <div class="card" id="report-submission-card" style="display: none;">
                    <div class="card-header">
                        <h3 class="h5 mb-0">Submit a New Report</h3>
                    </div>
                    <div class="card-body">
                        <form id="report-form">
                            <div class="mb-3">
                                <label for="report-title" class="form-label">Title</label>
                                <input type="text" class="form-control" id="report-title" required>
                            </div>
                            <div class="mb-3">
                                <label for="report-content" class="form-label">Content</label>
                                <textarea class="form-control" id="report-content" rows="5" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Submit Report</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>
</html>
