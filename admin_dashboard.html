<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body class="bg-light">
    <div id="notification-container" style="position: fixed; top: 1rem; right: 1rem; z-index: 1050;"></div>
    <nav id="navbar"></nav>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2">Admin Dashboard</h1>
            <h2 class="h5 mb-0">Welcome, <span id="admin-name"></span>!</h2>
        </div>

        <div class="row">
            <!-- Pending Registrations -->
            <div class="col-lg-12 mb-4">
                <div class="card border-warning">
                    <div class="card-header">
                        <h3 class="h5 mb-0">Pending Student Registrations</h3>
                    </div>
                    <div class="card-body">
                        <div id="pending-users-container" class="table-responsive">
                            <!-- Populated by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- User Management -->
            <div class="col-lg-12 mb-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3 class="h5 mb-0">User Management</h3>
                        <button class="btn btn-primary btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#addUserCollapse" aria-expanded="false" aria-controls="addUserCollapse">
                            Add New User
                        </button>
                    </div>
                    <div class="collapse" id="addUserCollapse">
                        <div class="card-body bg-light-subtle">
                            <form id="add-user-form">
                                <div class="row">
                                    <div class="col-md-4 mb-3">
                                        <label for="new-username" class="form-label">Username</label>
                                        <input type="text" class="form-control" id="new-username" required>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label for="new-password" class="form-label">Password</label>
                                        <input type="password" class="form-control" id="new-password" required>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label for="new-user-type" class="form-label">User Type</label>
                                        <select class="form-select" id="new-user-type">
                                            <option value="student">Student</option>
                                            <option value="supervisor">Supervisor</option>
                                        </select>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-success">Add User</button>
                            </form>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="users-container" class="table-responsive">
                            <!-- Populated by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Internship Management -->
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3 class="h5 mb-0">Internship Management</h3>
                        <button class="btn btn-primary btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#addInternshipCollapse" aria-expanded="false" aria-controls="addInternshipCollapse">
                            Assign Internship
                        </button>
                    </div>
                    <div class="collapse" id="addInternshipCollapse">
                        <div class="card-body bg-light-subtle">
                            <form id="add-internship-form">
                                <div class="row">
                                    <div class="col-md-3 mb-3">
                                        <label for="student-select" class="form-label">Student</label>
                                        <select id="student-select" class="form-select" required></select>
                                    </div>
                                    <div class="col-md-3 mb-3">
                                        <label for="internship-company" class="form-label">Company</label>
                                        <input type="text" id="internship-company" class="form-control" required>
                                    </div>
                                    <div class="col-md-3 mb-3">
                                        <label for="internship-position" class="form-label">Position</label>
                                        <input type="text" id="internship-position" class="form-control" required>
                                    </div>
                                    <div class="col-md-3 mb-3">
                                        <label for="supervisor-select" class="form-label">Supervisor</label>
                                        <select id="supervisor-select" class="form-select" required></select>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-success">Assign Internship</button>
                            </form>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="internships-container" class="table-responsive">
                            <!-- Populated by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>
</html>
